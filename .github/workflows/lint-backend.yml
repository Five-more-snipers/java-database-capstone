name: Lint Backend

on:
  push:
  pull_request:

jobs:
  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Checkstyle & Google Checks
        run: |
          curl -sL -o checkstyle.jar https://github.com/checkstyle/checkstyle/releases/download/checkstyle-10.21.0/checkstyle-10.21.0-all.jar
          curl -sL -o google_checks.xml https://raw.githubusercontent.com/checkstyle/checkstyle/checkstyle-10.21.0/src/main/resources/google_checks.xml

      - name: Run Checkstyle
        run: java -jar checkstyle.jar -c google_checks.xml app/src/main/java/com/project/back_end || true