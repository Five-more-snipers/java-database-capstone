name: Lint Frontend

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install linters
        run: npm install -g htmlhint stylelint eslint
      - name: Run linters
        run: |
          htmlhint "app/src/main/resources/static/**/*.html" || true
          stylelint "app/src/main/resources/static/assets/css/**/*.css" || true
          eslint "app/src/main/resources/static/js/**/*.js" || true